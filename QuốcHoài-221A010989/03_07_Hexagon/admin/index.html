<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - Hexagon Corporation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-[#030712]">
    <div class="hexagon-bg flex items-center justify-center relative px-4">
        <!-- Floating Hexagon grid background overlay -->
        <div class="hex-grid"></div>
        
        <!-- Interactive particles container -->
        <div id="particlesContainer" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

        <!-- Login Card -->
        <div class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl z-10 animate-fade-in relative">
            <div class="text-center mb-8">
                <!-- Branding logo -->
                <div class="inline-flex items-center justify-center w-16 h-16 bg-[#1A6B49] rounded-2xl mb-4 border border-emerald-500/30">
                    <img src="../Logo/logo-hhc.png" alt="Hexagon Logo" class="w-10 h-10 object-contain">
                </div>
                <h2 class="text-2xl font-bold text-white uppercase tracking-wider">Hexagon Corporation</h2>
                <p class="text-gray-400 text-sm mt-1">Hệ thống quản trị nội dung website</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Tên đăng nhập</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                            <i class="far fa-user"></i>
                        </span>
                        <input type="text" id="username" 
                            class="w-full bg-gray-900/60 border border-gray-700/60 focus:border-amber-500/80 rounded-xl py-3 pl-10 pr-4 text-white placeholder-gray-500 focus:outline-none transition-all"
                            placeholder="admin">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Mật khẩu</label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="password" 
                            class="w-full bg-gray-900/60 border border-gray-700/60 focus:border-amber-500/80 rounded-xl py-3 pl-10 pr-4 text-white placeholder-gray-500 focus:outline-none transition-all"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-400 cursor-pointer">
                        <input type="checkbox" checked class="rounded border-gray-700 text-[#1A6B49] focus:ring-0 mr-2 bg-gray-900">
                        Ghi nhớ đăng nhập
                    </label>
                </div>

                <button type="submit" 
                    class="w-full py-3.5 bg-gradient-to-r from-[#1A6B49] to-emerald-600 hover:from-emerald-600 hover:to-[#1A6B49] text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-950/50 hover:shadow-emerald-950/80 border border-emerald-500/20 active:scale-[0.98]">
                    Đăng Nhập
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-gray-800 text-center">
                <p class="text-xs text-gray-500">
                    Tài khoản demo: <span class="text-amber-500">Đăng nhập tự do</span> (nhập bất kỳ hoặc để trống)
                </p>
                <a href="../Trang-Chủ.html" class="inline-flex items-center text-xs text-gray-400 hover:text-white transition mt-4">
                    <i class="fas fa-arrow-left mr-2"></i> Quay lại website chính
                </a>
            </div>
        </div>
    </div>

    <!-- Core Javascript -->
    <script src="admin.js"></script>
    <script>
        // Check auth on load
        checkAuth();

        // Dynamically populate floating background particles
        (function() {
            const container = document.getElementById('particlesContainer');
            const particleCount = 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                const isGold = Math.random() > 0.6;
                particle.className = `particle ${isGold ? 'particle-gold' : ''}`;
                
                // Random properties
                const size = Math.random() * 200 + 50;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 10}s`;
                particle.style.animationDuration = `${Math.random() * 20 + 15}s`;
                
                container.appendChild(particle);
            }
        })();

        // Form Submit handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Cho phép đăng nhập tự do với bất kỳ thông tin nào
            localStorage.setItem('admin_logged_in', 'true');
            showToast('Đăng nhập thành công! Đang chuyển hướng...', 'success');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1200);
        });
    </script>
</body>
</html>
