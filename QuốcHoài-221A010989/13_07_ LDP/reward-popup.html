<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Nhận Thưởng - Futuristic Cyberpunk</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reward-popup.css">
    <style>
        /* CSS Nền Demo để kiểm tra tính năng không có backdrop */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c20 0%, #1a103c 50%, #0d061e 100%);
            font-family: 'Be Vietnam Pro', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .demo-controls {
            text-align: center;
            z-index: 1;
        }

        .demo-btn {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 800;
            color: #000000;
            background: #00f0ff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transition: all 0.2s ease;
        }

        .demo-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.9);
        }
    </style>
</head>
<body>

    <!-- Demo Trigger Button -->
    <div class="demo-controls">
        <h1 style="margin-bottom: 20px;">Demo Popup Nhận Thưởng Code</h1>
        <button type="button" class="demo-btn" onclick="openRewardPopup('50 Hoa', 'ABACA0145656')">
            Mở Popup Nhận Thưởng
        </button>
    </div>

    <!-- ==========================================================
         REWARD POPUP OVERLAY (Futuristic Cyberpunk Style)
         ========================================================== -->
    <div class="reward-popup__overlay" id="rewardPopupOverlay">
        <div class="reward-popup__container">
            
            <!-- Tech Frame Borders & Corner Accents -->
            <div class="reward-popup__cyber-border"></div>

            <!-- Top Header Tech Tag -->
            <div class="reward-popup__header-tech">
                <span class="reward-popup__tech-tag">ANQILATASI</span>
            </div>

            <!-- Close Button (Neon Pink Cross) -->
            <button type="button" class="reward-popup__close" onclick="closeRewardPopup()" aria-label="Đóng Popup">
                <svg class="reward-popup__close-icon" viewBox="0 0 36 36" width="34" height="34">
                    <path d="M 8,8 L 28,28 M 28,8 L 8,28" stroke="#ff00aa" stroke-width="4.5" stroke-linecap="round" />
                    <path d="M 8,8 L 28,28 M 28,8 L 8,28" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
                </svg>
            </button>

            <!-- Vertical HUD Text (Left Side) -->
            <div class="reward-popup__hud reward-popup__hud--left">
                <span>H</span>
                <span>Y</span>
                <span class="reward-popup__hud-gap"></span>
                <span>IN</span>
                <span>CON</span>
                <span class="reward-popup__hud-gap"></span>
                <span>T</span>
                <span>E</span>
                <span>X</span>
                <span>T#</span>
                <span class="reward-popup__hud-gap"></span>
                <span>JIANGYI</span>
                <span class="reward-popup__hud-gap"></span>
                <span>M</span>
                <span>U</span>
                <span>S</span>
                <span>T</span>
            </div>

            <!-- Vertical HUD Text (Right Side) -->
            <div class="reward-popup__hud reward-popup__hud--right">
                <span>EN</span>
                <span>ENEY</span>
                <span class="reward-popup__hud-gap"></span>
                <span>--</span>
                <span>T</span>
                <span>H</span>
                <span>IS</span>
                <span>T#</span>
                <span class="reward-popup__hud-gap"></span>
                <span>BAO</span>
                <span>Q</span>
                <span>IA</span>
                <span>N</span>
                <span>G</span>
            </div>

            <!-- Popup Content Body -->
            <div class="reward-popup__body">
                
                <!-- Headline Text -->
                <h2 class="reward-popup__title">
                    Đã đạt mốc <span id="rewardPopupMilestone">XX</span>,<br>
                    Code của Đại Hiệp là:
                </h2>

                <!-- Code Display Box (Chamfered Cut Corner Style) -->
                <div class="reward-popup__code-box">
                    <span class="reward-popup__code-text" id="rewardPopupCode">ABACA0145656</span>
                </div>

                <!-- Action Area (Gold Frame & SAO CHÉP Button) -->
                <div class="reward-popup__action">
                    
                    <!-- Decorative Gold Outer Frame & Stars -->
                    <div class="reward-popup__gold-frame">
                        <!-- Left 4-Point Star -->
                        <svg class="reward-popup__star reward-popup__star--left" viewBox="0 0 24 24" width="18" height="18">
                            <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z" fill="#ffea79" />
                        </svg>
                        
                        <!-- Right 4-Point Star -->
                        <svg class="reward-popup__star reward-popup__star--right" viewBox="0 0 24 24" width="18" height="18">
                            <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z" fill="#ffea79" />
                        </svg>

                        <!-- Copy Button -->
                        <button type="button" class="reward-popup__copy-btn" onclick="copyRewardCode()">
                            SAO CHÉP
                        </button>
                    </div>

                    <!-- Bottom Diamond Decorative Accent -->
                    <div class="reward-popup__diamond">
                        <svg viewBox="0 0 16 16" width="14" height="14">
                            <path d="M8 0L14 8L8 16L2 8Z" fill="#ff00aa" stroke="#ffea79" stroke-width="1.5"/>
                        </svg>
                    </div>

                    <!-- Toast Notification -->
                    <div class="reward-popup__toast" id="rewardPopupToast">
                        Đã sao chép mã thành công
                    </div>
                </div>

            </div>

            <!-- Bottom Cyber Notch Bar -->
            <div class="reward-popup__bottom-bar"></div>

        </div>
    </div>

    <!-- JavaScript File -->
    <script src="js/reward-popup.js"></script>
</body>
</html>
