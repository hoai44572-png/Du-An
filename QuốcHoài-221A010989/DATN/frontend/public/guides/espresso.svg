<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d1a08;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#c87941;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1a0a05;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="300" fill="url(#glow)"/>
  <!-- Espresso cup -->
  <rect x="315" y="200" width="170" height="120" rx="8" fill="#c87941" opacity="0.9"/>
  <rect x="325" y="210" width="150" height="100" rx="6" fill="#3d1a08"/>
  <!-- Coffee surface -->
  <ellipse cx="400" cy="235" rx="60" ry="15" fill="#5c2d0a"/>
  <ellipse cx="400" cy="235" rx="50" ry="12" fill="#8b4513"/>
  <!-- Crema -->
  <ellipse cx="400" cy="233" rx="45" ry="10" fill="#c8821a" opacity="0.7"/>
  <!-- Handle -->
  <path d="M 485 220 Q 520 250 485 280" stroke="#c87941" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Saucer -->
  <ellipse cx="400" cy="325" rx="110" ry="18" fill="#c87941" opacity="0.8"/>
  <!-- Steam -->
  <path d="M 380 195 Q 370 170 380 145" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="4,4"/>
  <path d="M 400 190 Q 390 162 400 135" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="4,4"/>
  <path d="M 420 195 Q 410 168 420 142" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="4,4"/>
  <!-- Text -->
  <text x="400" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#c87941">ESPRESSO</text>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c87941" opacity="0.7">Perfect Shot Guide</text>
</svg>
