<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0d05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="latte" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e8dc;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Latte glass/cup -->
  <rect x="295" y="140" width="210" height="220" rx="12" fill="url(#latte)" opacity="0.9"/>
  <!-- Milk foam top -->
  <ellipse cx="400" cy="155" rx="95" ry="18" fill="#f8f4ef" opacity="0.95"/>
  <!-- Latte art leaf -->
  <ellipse cx="400" cy="155" rx="70" ry="12" fill="#fff" opacity="0.6"/>
  <path d="M 400 145 Q 380 155 400 165 Q 420 155 400 145" fill="#c87941" opacity="0.7"/>
  <!-- Handle -->
  <path d="M 505 180 Q 545 230 505 270" stroke="#c87941" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Saucer -->
  <ellipse cx="400" cy="366" rx="130" ry="20" fill="#c87941" opacity="0.7"/>
  <!-- Steam -->
  <path d="M 380 135 Q 368 108 380 80" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="4,4"/>
  <path d="M 405 130 Q 393 100 405 72" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="4,4"/>
  <!-- Text -->
  <text x="400" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#c87941">LATTE</text>
  <text x="400" y="463" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c87941" opacity="0.7">Creamy &amp; Smooth</text>
</svg>
